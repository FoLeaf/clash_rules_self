[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则
;
; 分流约定:
; 1) 微信/淘宝等国内域名直连，国内进程仅兜底未知目标，不全局直连腾讯云 ASN
; 2) 专项服务规则在通用国内域名/IP规则之前；国内下载 CDN 保留明确的直连例外
; 3) 海外 AI 使用不含进程规则的 Quantumult X 列表；cn.list 直连，海外子域先于国内父域
; 4) OpenAI 优先内联锁定 AI（含官方共享依赖/语音 IP）；Anthropic 域名内联锁定 AI 分组，先于共享 SaaS 回落与 AI 聚合列表，不依赖上游收录
; 5) AI 专属登录优先于共享 SaaS；域名规则不能区分 Google /sorry 与搜索
; 6) 公共 STUN 与 Claude 同走 AI，先于国内进程兜底；国内服务按目标域名直连
; 7) Loyalsoldier 使用 Surge ruleset 明文列表，避免 clash-domain: 前缀被原样写成 RULE-SET
; 8) 不启用广告拦截；海外专用组与漏网之鱼不提供 DIRECT；游戏/微软/苹果保留可选直连
; 9) Play 的 googleapis.cn 必须在 ChinaDomain 的 DOMAIN-SUFFIX,cn 之前，并与下载 CDN 同一出口
; 10) 本文件是订阅转换外部配置；DNS、TUN、IPv6 与链式代理由订阅基础 YAML 或客户端配置，详见 README.md
; 11) Steam 定位与下载固定直连：CM、ipv6check 与下载域名走本机原出口，
;     Valve 看到真实 IP 后按就近位置分配区域，下载从大陆镜像与 Valve 内容缓存取包；
;     商店、社区、UGC 与联机，以及 Epic 等平台仍由游戏平台组决定出口

;去广告：不支持
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持
;增强国外GFW：支持

;设置规则标志位
;局域网
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

;OpenAI / ChatGPT / Codex 优先锁定 AI：核心域名、官方依赖和语音 IP
;与 rules/openai-ai.list 同步；须先于国内进程、共享 SaaS、Apple 和聚合规则
;共享依赖按目标域名整体走 AI；不使用整个 Codex/浏览器进程规则或公共云 ASN
; BEGIN OPENAI AI OVERRIDES
