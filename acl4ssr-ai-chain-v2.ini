[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则
;
; 分流约定:
; 1) 微信/淘宝等明确的国内域名与进程优先直连，不全局直连腾讯云 ASN
; 2) Play、AI、社交与流媒体专项规则在通用国内域名/IP规则之前
; 3) AI 使用 VPSDance global.list；cn.list 直连，海外具体域名先于国内父域
; 4) AI 专属登录优先于共享 SaaS；域名规则不能区分 Google /sorry 与搜索
; 5) 公共 STUN 走节点选择；国内客户端仍由更靠前的进程规则直连
; 6) Loyalsoldier 使用 Surge ruleset 明文列表，避免 clash-domain: 前缀被原样写成 RULE-SET
; 7) 不启用广告拦截；漏网之鱼保留默认 DIRECT，未收录的海外服务需手动选代理
; 8) Play 的 googleapis.cn 必须在 ChinaDomain 的 DOMAIN-SUFFIX,cn 之前，并与下载 CDN 同一出口

;去广告：不支持
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持
;增强国外GFW：支持

;设置规则标志位
;局域网
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list

;TikTok 进程先于国内共享字节域名，避免 snssdk.com/isnssdk.com 被直连
