[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则
;
; 修复说明 (保守修复):
; 1) Play 下载：补 gvt1/gvt2/ggpht；storage.googleapis.com 在 AI 前强制走 🚀 节点选择
; 2) AI 必须在 Google 全量之前（否则 google.com/googleapis.com 吃掉 Gemini）
; 3) 去掉 blackmatrix7 Gemini/Bard 兜底（含过宽 DOMAIN-SUFFIX,apis.google.com）
; 4) VPSDance AI 聚合误伤的公共 SaaS/基础设施，在 AI 前强制回 🚀 节点选择
; 5) 弃用 GlobalMedia 大杂烩（含 amazonaws.com 整站），改用专项流媒体列表
; 6) YouTube 提到 Google 之前，避免 DOMAIN-KEYWORD,google 抢走 googlevideo
; 7) GoogleCN 直连补充须在 Google 全量之前；已移除 FCM 独立分组
; 8) Gemini 登录/验证链固定到 AI 出口，避免 google.com/sorry 检测到出口 IP 跳变

;去广告：支持
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持
;增强国外GFW：支持

;设置规则标志位
;局域网与必要直连
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list

;Play 商店下载 CDN（必须在 AI 之前，统一走节点选择）
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,gvt1.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,gvt2.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,ggpht.com
ruleset=🚀 节点选择,[]DOMAIN,storage.googleapis.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,play.googleapis.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,play-fe.googleapis.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,play-lh.googleusercontent.com
ruleset=🚀 节点选择,[]DOMAIN,android.clients.google.com

;AI 聚合误伤的公共基础设施 / 共享 SaaS（必须在 AI 规则之前，回落节点选择）
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,auth0.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,challenges.cloudflare.com
ruleset=🚀 节点选择,[]DOMAIN,static.cloudflareinsights.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,sentry.io
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,stripe.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,segment.io
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,intercom.io
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,intercomcdn.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,sso.amazonaws.com
ruleset=🚀 节点选择,[]DOMAIN,cognito-identity.us-east-1.amazonaws.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,algolia.net
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,launchdarkly.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,datadoghq.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,datadog.com
ruleset=🚀 节点选择,[]DOMAIN,odc.officeapps.live.com
ruleset=🚀 节点选择,[]DOMAIN,location.microsoft.com
ruleset=🚀 节点选择,[]DOMAIN,self.events.data.microsoft.com
ruleset=🚀 节点选择,[]DOMAIN-SUFFIX,api.microsoftapp.net

;Gemini / Google AI 会话粘滞（须在 AI 聚合和 Google 全量之前）
;Google 会比较 Gemini、账号登录和 sorry 验证页的出口 IP
ruleset=🤖 AI,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=🤖 AI,[]DOMAIN,google.com
ruleset=🤖 AI,[]DOMAIN,www.google.com
ruleset=🤖 AI,[]DOMAIN,accounts.google.com
ruleset=🤖 AI,[]DOMAIN,myaccount.google.com
ruleset=🤖 AI,[]DOMAIN,ogs.google.com
ruleset=🤖 AI,[]DOMAIN,apis.google.com
ruleset=🤖 AI,[]DOMAIN,oauth2.googleapis.com
ruleset=🤖 AI,[]DOMAIN,accounts.googleusercontent.com

;海外 AI 服务：仅用 VPSDance 聚合（须在 Google 全量之前）
;不再叠加 Gemini/Bard 列表，避免 apis.google.com 等过宽规则
ruleset=🤖 AI,https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/surge/all.list

;国内可直连的 Google 下载/推送补充（须在 Google 全量之前才能命中）
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
;YouTube 须在 Google 全量之前（Google.list 含 DOMAIN-KEYWORD,google 会抢走 googlevideo）
ruleset=🎬 国外流媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
;其余 Google 服务走节点选择（不单独分组）
ruleset=🚀 节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list

