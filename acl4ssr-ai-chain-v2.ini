;Steam 内容下载固定直连：下载从大陆镜像与 Valve 内容缓存取包，走本机原出口 IP，
;不随游戏平台组切换到节点。商店、社区、UGC、CM 与游戏联机仍跟随游戏平台组，
;因此游戏组选中节点时 Steam 能看到的出口 IP 仍由该节点决定，下载包体则保持本地直连。
;与 rules/steam-download-direct.list 同步；须先于游戏平台组、SteamCN、Steam 列表
