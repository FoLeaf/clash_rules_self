# Paste into MiSub's custom DNS editor, separately from the INI rule template.
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - geosite:private
    - geosite:category-ntp
    - "*.lan"
    - "*.local"
    - localhost
    - "*.arpa"
    - token-plan-cn.xiaomimimo.com
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - "223.5.5.5#DIRECT"
    - "119.29.29.29#DIRECT"
  direct-nameserver:
    - "223.5.5.5#DIRECT"
    - "119.29.29.29#DIRECT"
  direct-nameserver-follow-policy: false
  nameserver:
    - "https://1.1.1.1/dns-query#🚀 节点选择"
    - "https://8.8.8.8/dns-query#🚀 节点选择"
  nameserver-policy:
    "geosite:private,cn":
      - "223.5.5.5#DIRECT"
      - "119.29.29.29#DIRECT"
  fallback: []
