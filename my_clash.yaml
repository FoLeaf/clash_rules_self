port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
dns:
  default-nameserver:
    - tls://223.5.5.5
  enable: true
  enhanced-mode: fake-ip
  ipv6: true
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    geosite:cn,private:
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    geosite:geolocation-!cn:
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  respect-rules: true
proxies: []
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - ⚖️ 负载均衡
      - DIRECT
      - 🇺🇸 US-PPFLIGHT-IPV6-备用
      - 🇸🇬 SG-AWS
      - 🇺🇸 US-MoeCloud
      - 🇺🇸 US-PPFLIGHT
  - name: ♻️ 自动选择
    type: url-test
    proxies:
      - 🇺🇸 US-PPFLIGHT-IPV6-备用
      - 🇸🇬 SG-AWS
      - 🇺🇸 US-MoeCloud
      - 🇺🇸 US-PPFLIGHT
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: ⚖️ 负载均衡
    type: load-balance
    proxies:
      - 🇺🇸 US-PPFLIGHT-IPV6-备用
      - 🇸🇬 SG-AWS
      - 🇺🇸 US-MoeCloud
      - 🇺🇸 US-PPFLIGHT
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 📲 电报消息
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - 🇺🇸 US-PPFLIGHT-IPV6-备用
      - 🇸🇬 SG-AWS
      - 🇺🇸 US-MoeCloud
      - 🇺🇸 US-PPFLIGHT
  - name: 🤖 AI
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - 🇺🇸 US-PPFLIGHT-IPV6-备用
      - 🇸🇬 SG-AWS
      - 🇺🇸 US-MoeCloud
      - 🇺🇸 US-PPFLIGHT
  - name: 🎬 国外流媒体
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
